# PostgreSQL prêt à l'emploi pour le développement local.
# Démarrage : docker compose up -d db
services:
  db:
    image: postgres:16-alpine
    container_name: skillswap-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: skillswap
      POSTGRES_PASSWORD: skillswap
      POSTGRES_DB: skillswap
    ports:
      - "5432:5432"
    volumes:
      - skillswap-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillswap -d skillswap"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  skillswap-pgdata:
